
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090d1c">
<title>HAN Coding Space</title>

<style>
:root {
  --bg: #090d1c;
  --card: #121a30;
  --card2: #080e20;
  --border: #27304c;
  --purple: #8975ff;
  --cyan: #53e3d0;
  --muted: #9ba7c4;
  --text: #edf1ff;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
a { color: var(--cyan); }
header {
  padding: 22px 18px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(110deg,#0b1021,#17183c,#0b1021);
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.logo {
  font-size: clamp(22px,5vw,32px);
  font-weight: 800;
}
.logo span { color: var(--cyan); }
.clock { text-align: right; }
#clock {
  color: var(--cyan);
  font-size: 19px;
  font-weight: bold;
}
#date { color: var(--muted); font-size: 13px; margin-top: 6px; }

nav {
  display: flex;
  gap: 9px;
  padding: 15px;
  overflow-x: auto;
  background: #0c1020;
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid var(--border);
}
nav button {
  flex: 0 0 auto;
  padding: 13px 17px;
  color: var(--text);
  background: #19213b;
  border: 1px solid var(--border);
  border-radius: 14px;
}
nav button.active, .primary {
  background: var(--purple);
  color: white;
  border-color: var(--purple);
}
main { max-width: 1100px; margin: auto; padding: 18px; }
.page { display: none; }
.page.active { display: block; }
.card {
  background: linear-gradient(145deg,#151d35,#101629);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 22px;
  margin-bottom: 20px;
  overflow: hidden;
}
.hero {
  background: linear-gradient(135deg,#151b33,#101529);
  border-top: 5px solid var(--purple);
}
.eyebrow { color: var(--cyan); }
h1 { font-size: clamp(28px,6vw,40px); margin: 18px 0; }
h2 { font-size: 25px; margin-top: 0; }
h3 { font-size: 18px; }
p { line-height: 1.65; }
.muted { color: var(--muted); }
.btn, .song-buttons button, .wiki-search button {
  border: 1px solid var(--border);
  background: #1b2340;
  color: var(--text);
  border-radius: 11px;
  padding: 11px 14px;
}
.btn.primary { background: var(--purple); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
video, iframe { width: 100%; border: 0; border-radius: 15px; }
video { background: #080e20; max-height: 520px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(190px,1fr));
  gap: 12px;
}
.metric {
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 17px;
  padding: 17px;
  min-width: 0;
}
.metric .value { font-size: 24px; font-weight: bold; margin-top: 10px; overflow-wrap: anywhere; }
.up { color: #53dfb0; }
.down { color: #ff7f9c; }
input, textarea, select {
  width: 100%;
  padding: 13px;
  color: var(--text);
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 11px;
  outline: none;
}
input:focus, textarea:focus { border-color: var(--purple); }
.search-row { display: flex; gap: 9px; margin: 12px 0 18px; }
.search-row input { flex: 1; min-width: 0; }
.song-group { padding: 8px 0; border-bottom: 1px solid var(--border); }
.song-group h3 { color: var(--cyan); }
.song-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  padding: 15px 0;
  border-bottom: 1px solid #252d46;
}
.song-row:last-child { border-bottom: 0; }
.song-row strong { flex: 1; min-width: 140px; }
.song-buttons { display: flex; gap: 6px; }
.song-buttons .primary { background: var(--purple); }
.wiki-result, .stock-row {
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
}
.wiki-result p { margin: 7px 0; }
.stock-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
}
.stock-row a { text-decoration: none; font-weight: bold; }
.chat-box {
  height: 320px;
  overflow-y: auto;
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 12px;
}
.message {
  max-width: 90%;
  width: fit-content;
  padding: 10px 13px;
  border-radius: 12px;
  background: #202947;
  margin: 8px 0;
  overflow-wrap: anywhere;
}
.message.me { margin-left: auto; background: #6554d9; }
footer {
  text-align: center;
  color: var(--muted);
  padding: 25px 15px;
  border-top: 1px solid var(--border);
  font-size: 13px;
}
.notice { color: var(--muted); font-size: 13px; }
@media(max-width:480px) {
  main { padding: 12px; }
  .card { padding: 17px; border-radius: 18px; }
  nav { padding: 10px; }
  nav button { padding: 12px 14px; }
  .search-row { flex-wrap: wrap; }
  .search-row button { width: 100%; }
}
</style>
</head>

  <div class="header-top">
    <div class="logo">HAN <span>&lt;/&gt;</span> Coding Space</div>

</nav>
